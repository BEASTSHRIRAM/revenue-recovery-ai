[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revenue-recovery-ai"
version = "0.1.0"
description = "AI agent that recovers failed subscription payments"
requires-python = ">=3.11"
dependencies = [
    # --- web ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    # --- data ---
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "greenlet>=3.1",
    # --- agent ---
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=1.0",
    "langchain-xai>=1.3",
    # --- integrations ---
    "httpx>=0.27",
    "razorpay>=1.4",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "asgi-lifespan>=2.1",
]
postgres = ["asyncpg>=0.30"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
